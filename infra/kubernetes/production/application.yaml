apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudtool-gateway
  namespace: cloudtool-prod
data:
  default.conf: |
    server {
      listen 80 default_server;
      server_name _;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      location = /health { access_log off; default_type text/plain; return 200 "ok\\n"; }
      # API services enforce TrustedHostMiddleware.  Gateway is the sole public
      # entrypoint, so use their permitted internal host on proxied requests.
      location /api/v1/cloud/console-proxy/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host localhost; proxy_read_timeout 3600s; proxy_buffering off; }
      location /api/ { proxy_pass http://backend:8000; proxy_set_header Host localhost; proxy_set_header X-Forwarded-Proto $scheme; }
      location /agent-api/ { proxy_pass http://agent-service:8004/; proxy_set_header Host localhost; proxy_set_header X-Forwarded-Proto $scheme; }
      location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: cloudtool-prod }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }, { name: harbor-pull }]
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: ghcr.io/ducanhslvp/cloudtool-frontend:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: cloudtool-prod }
spec: { selector: { app: frontend }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: cloudtool-prod }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }, { name: harbor-pull }]
      containers:
        - name: backend
          image: ghcr.io/ducanhslvp/cloudtool-backend:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          command: [uvicorn, app.terraform_app:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
          envFrom: [{ secretRef: { name: cloudtool-backend-env } }]
          ports: [{ containerPort: 8000 }]
          # Probes originate from the kubelet by pod IP.  Supply a permitted
          # Host header so the application's TrustedHostMiddleware accepts them.
          readinessProbe: { httpGet: { path: /health/ready, port: 8000, httpHeaders: [{ name: Host, value: localhost }] }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8000, httpHeaders: [{ name: Host, value: localhost }] }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: cloudtool-prod }
spec: { selector: { app: backend }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-service, namespace: cloudtool-prod }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: agent-service } }
  template:
    metadata: { labels: { app: agent-service } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }, { name: harbor-pull }]
      containers:
        - name: agent
          image: ghcr.io/ducanhslvp/cloudtool-agent-service:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: cloudtool-agent-env } }]
          ports: [{ containerPort: 8004 }]
          readinessProbe: { httpGet: { path: /health/live, port: 8004, httpHeaders: [{ name: Host, value: localhost }] }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8004, httpHeaders: [{ name: Host, value: localhost }] }, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: agent-service, namespace: cloudtool-prod }
spec: { selector: { app: agent-service }, ports: [{ port: 8004, targetPort: 8004 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: cloudtool-prod }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: nginx:1.29-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }]
          readinessProbe: { httpGet: { path: /health, port: 80 } }
          livenessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 128Mi } }
      volumes: [{ name: config, configMap: { name: cloudtool-gateway } }]
---
apiVersion: v1
kind: Service
metadata: { name: cloudtool-public, namespace: cloudtool-prod }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ name: http, port: 80, targetPort: 80, nodePort: 30443 }]
