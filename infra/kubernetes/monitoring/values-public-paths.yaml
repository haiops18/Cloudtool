# Values for kube-prometheus-stack when all web UIs are exposed behind the
# HAProxy HTTPS entrypoint at https://171.254.94.149/.
# Apply with: helm upgrade monitoring prometheus-community/kube-prometheus-stack
# -n monitoring --reuse-values -f values-public-paths.yaml

grafana:
  service:
    type: NodePort
    nodePort: 30300
  grafana.ini:
    server:
      root_url: https://171.254.94.149/grafana/
      serve_from_sub_path: true

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    externalUrl: https://171.254.94.149/prometheus
    routePrefix: /prometheus

alertmanager:
  service:
    type: NodePort
    nodePort: 30903
  alertmanagerSpec:
    externalUrl: https://171.254.94.149/alertmanager
    routePrefix: /alertmanager
