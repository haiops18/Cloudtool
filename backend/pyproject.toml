[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-project-operations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "websockets>=15,<17", "pydantic-settings>=2.10,<3", "sqlalchemy[asyncio]>=2.0.41,<3", "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2", "httpx>=0.28,<1", "curl-cffi>=0.13,<1", "argon2-cffi>=25,<26", "cryptography>=45,<47", "python-multipart>=0.0.20,<1", "openpyxl>=3.1.5,<4", "email-validator>=2.2,<3", "pywinpty>=3,<4; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
