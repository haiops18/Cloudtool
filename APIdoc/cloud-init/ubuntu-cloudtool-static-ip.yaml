#cloud-config
# CloudTool static networking
# Variables: {{TELEPORT_ENABLE}}, {{TP_MONITOR_IP}}, {{local_gateway}}, {{vpc_cidr}}

package_update: false
packages:
  - netplan.io

write_files:
  - path: /usr/local/sbin/cloudtool-static-ip.sh
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      TELEPORT_ENABLED='{{TELEPORT_ENABLE}}'
      MONITOR_IP='{{TP_MONITOR_IP}}'
      LOCAL_GATEWAY='{{local_gateway}}'
      VPC_CIDR='{{vpc_cidr}}'
      ELASTIC_GATEWAY='171.254.95.254'
      MONITOR_PREFIX=21
      NETPLAN_FILE=/etc/netplan/50-cloud-init.yaml
      NETPLAN_DIR=/etc/netplan
      BACKUP_ROOT=/var/backups/cloudtool/netplan

      # 1) Discover cards and their IPv4 addresses.
      interfaces() {
        for path in /sys/class/net/eth* /sys/class/net/ens*; do
          [ -e "$path" ] && basename "$path"
        done
      }
      ip_addresses() {
        ip -o -4 addr show dev "$1" scope global | awk '{print $4}'
      }
      ip_only() { printf '%s' "$1" | cut -d/ -f1; }
      is_elastic() { [[ "$1" == 171.* ]]; }
      is_monitor() { [[ "$1" == 10.129.* ]]; }

      # 2) Classify every card as elastic, monitor, local, or empty. This is
      # repeated while waiting because Cloud NICs may appear after cloud-init.
      declare -A CARD_IPS CARD_TYPE CARD_GATEWAY
      elastic_iface=''
      local_iface=''
      monitor_iface=''

      classify_interfaces() {
        CARD_IPS=(); CARD_TYPE=(); CARD_GATEWAY=()
        elastic_iface=''; local_iface=''; monitor_iface=''
        for iface in $(interfaces); do
          CARD_IPS[$iface]=$(ip_addresses "$iface")
          type=empty
          while IFS= read -r cidr; do
            [ -n "$cidr" ] || continue
            ipaddr=$(ip_only "$cidr")
            if is_elastic "$ipaddr"; then
              type=elastic; elastic_iface="$iface"
            elif is_monitor "$ipaddr" && [ "$type" != elastic ]; then
              type=monitor; monitor_iface="${monitor_iface:-$iface}"
            elif [ "$type" = empty ]; then
              type=local; local_iface="${local_iface:-$iface}"
            fi
          done <<< "${CARD_IPS[$iface]}"
          CARD_TYPE[$iface]=$type
          CARD_GATEWAY[$iface]=$(ip -4 route show default dev "$iface" | awk '/default/ {print $3; exit}')
        done
      }

      # Wait for the default route and, when enabled, the Monitor NIC/IP.
      for attempt in $(seq 1 90); do
        classify_interfaces
        default_iface=$(ip -o -4 route show to default | awk '{print $5; exit}')
        default_gateway=$(ip -4 route show default | awk '/default/ {print $3; exit}')
        monitor_ready=true
        if [ "$TELEPORT_ENABLED" = true ] && is_monitor "$MONITOR_IP"; then
          monitor_ready=false
          [ -n "$monitor_iface" ] && ip_addresses "$monitor_iface" | grep -Fq "$MONITOR_IP/" \
            && monitor_ready=true
        fi
        [ -n "$default_iface" ] && [ -n "$default_gateway" ] && [ "$monitor_ready" = true ] && break
        sleep 2
      done
      [ -n "${default_iface:-}" ] && [ -n "${default_gateway:-}" ] || exit 1
      [ "${monitor_ready:-true}" = true ] || {
        echo "Teleport monitor NIC/IP is not ready yet" >&2
        exit 1
      }

      primary_iface="${elastic_iface:-${local_iface:-$default_iface}}"
      primary_address=$(printf '%s\n' "${CARD_IPS[$primary_iface]:-}" | head -n 1)
      [ -n "$primary_address" ] || { echo "Primary card has no IPv4" >&2; exit 1; }
      # Elastic IPs use the fixed Viettel Cloud gateway; never derive it from
      # the IP address or a transient DHCP/default route.
      if [ "$primary_iface" = "$elastic_iface" ]; then
        primary_gateway="$ELASTIC_GATEWAY"
      else
        primary_gateway="${LOCAL_GATEWAY:-${CARD_GATEWAY[$primary_iface]:-$default_gateway}}"
      fi
      [ -n "$primary_gateway" ] || { echo "Primary gateway is unavailable" >&2; exit 1; }

      # 3) Resolve the monitor card after the wait loop.
      if [ "$TELEPORT_ENABLED" = true ] && is_monitor "$MONITOR_IP"; then
        for iface in $(interfaces); do
          if ip_addresses "$iface" | grep -Fq "$MONITOR_IP/"; then
            monitor_iface="$iface"
            break
          fi
        done
        monitor_iface="${monitor_iface:-$primary_iface}"
      else
        monitor_iface=''
      fi

      # 4) Back up the current netplan directory, then replace old YAML files.
      # The backup is retained for rollback/debugging and is never overwritten.
      mkdir -p "$NETPLAN_DIR"
      mkdir -p "$BACKUP_ROOT"
      backup_dir="$BACKUP_ROOT/$(date -u +%Y%m%dT%H%M%SZ)"
      cp -a "$NETPLAN_DIR" "$backup_dir"
      find "$NETPLAN_DIR" -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -delete

      # 5) Render three independent netplan blocks. A block is written only
      # when its IP type/NIC exists, making the generated YAML easy to inspect.
      cat > "$NETPLAN_FILE" <<EOF
      network:
        version: 2
        ethernets:
      EOF

      # Elastic IP (171.x): fixed Internet default route.
      if [ -n "$elastic_iface" ]; then
        elastic_address=$(printf '%s\n' "${CARD_IPS[$elastic_iface]}" | head -n 1)
        cat >> "$NETPLAN_FILE" <<EOF
          $elastic_iface:
            dhcp4: false
            addresses:
              - $elastic_address
            routes:
              - to: 0.0.0.0/0
                via: $ELASTIC_GATEWAY
            nameservers:
              addresses: [8.8.8.8, 1.1.1.1]
      EOF
      fi

      # Local Private IP (not 171.x or 10.129.x): without Elastic IP, this
      # NIC owns the default route. With Elastic IP, it only routes VPC traffic.
      if [ -n "$local_iface" ]; then
        local_address=$(printf '%s\n' "${CARD_IPS[$local_iface]}" | head -n 1)
        cat >> "$NETPLAN_FILE" <<EOF
          $local_iface:
            dhcp4: false
            addresses:
              - $local_address
            routes:
      EOF
        if [ -z "$elastic_iface" ]; then
          cat >> "$NETPLAN_FILE" <<EOF
              - to: 0.0.0.0/0
                via: $LOCAL_GATEWAY
      EOF
        elif [ -n "$VPC_CIDR" ] && [ -n "$LOCAL_GATEWAY" ]; then
          cat >> "$NETPLAN_FILE" <<EOF
              - to: $VPC_CIDR
                via: $LOCAL_GATEWAY
      EOF
        fi
        # DNS belongs only to the NIC that owns the default route.
        if [ -z "$elastic_iface" ]; then
          cat >> "$NETPLAN_FILE" <<EOF
            nameservers:
              addresses: [8.8.8.8, 1.1.1.1]
      EOF
        fi
      fi

      # Teleport/Monitor IP (10.129.x): address only; never add a route.
      if [ -n "$monitor_iface" ] && [ "$monitor_iface" != "$elastic_iface" ] \
        && [ "$monitor_iface" != "$local_iface" ]; then
        monitor_address=$(printf '%s\n' "${CARD_IPS[$monitor_iface]}" | head -n 1)
        [ -n "$monitor_address" ] || monitor_address="$MONITOR_IP/$MONITOR_PREFIX"
        cat >> "$NETPLAN_FILE" <<EOF
          $monitor_iface:
            dhcp4: false
            addresses:
              - $monitor_address
      EOF
      fi

      chmod 600 "$NETPLAN_FILE"
      netplan generate
      for attempt in $(seq 1 30); do
        netplan apply && exit 0
        sleep 2
      done
      echo "netplan apply failed after retries" >&2
      exit 1

runcmd:
  # Give cloud-init/networking time to finish attaching NICs. The script then
  # performs its own 180-second NIC readiness loop before rendering netplan.
  - [bash, -c, 'sleep 30; exec /usr/local/sbin/cloudtool-static-ip.sh']
